name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: Format, test DNS/URL/HTML/HTTP core, and check UEFI target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and UEFI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run portable-core tests
        run: cargo test --lib
      - name: Check UEFI compilation
        run: cargo check --target x86_64-unknown-uefi

  wolfssl-static-efi:
    name: Build embedded wolfSSL and standalone EFI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm lld curl unzip mingw-w64-common mingw-w64-x86-64-dev
      - name: Install stable Rust and UEFI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Download and verify embedded CA roots
        run: ./scripts/update-ca-bundle.sh
      - name: Build wolfSSL, bridge, and EFI application
        run: ./scripts/build-uefi.sh
      - name: Verify standalone EFI image
        run: |
          test -s target/x86_64-unknown-uefi/release/uefi-browser.efi
          file target/x86_64-unknown-uefi/release/uefi-browser.efi
          llvm-readobj --file-headers target/x86_64-unknown-uefi/release/uefi-browser.efi
      - name: Upload EFI application
        uses: actions/upload-artifact@v4
        with:
          name: uefi-browser-x86_64
          path: |
            target/x86_64-unknown-uefi/release/uefi-browser.efi
            dist/EFI/BOOT/BOOTX64.EFI
            build/cacert-uefi.manifest
